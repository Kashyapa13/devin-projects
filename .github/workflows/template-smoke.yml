name: template-smoke

# The fleet gate: `cp -r apps/_template apps/x && pipeline green with no
# edits` — that sentence is the acceptance test. Copies _template →
# apps/_smoke_run, runs lint/typecheck/test + builds the image, always
# deletes _smoke_run after (trap in scripts/ci/template-smoke.sh).
# Trigger is every PR so the required check always reports; `changes`
# gates the heavy build to template/platform/lockfile diffs.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "internal-apps/apps/_template/**"
      - "internal-apps/platform/**"
      - "internal-apps/scripts/ci/template-smoke.sh"
      - "internal-apps/pnpm-lock.yaml"
      - "internal-apps/pnpm-workspace.yaml"
      - ".github/workflows/template-smoke.yml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      hit: ${{ steps.d.outputs.hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        run: |
          if git diff --name-only "$TURBO_SCM_BASE...$TURBO_SCM_HEAD" | grep -qE 'internal-apps/(apps/_template|platform)/|internal-apps/(pnpm-lock\.yaml|pnpm-workspace\.yaml|scripts/ci/template-smoke\.sh)|\.github/workflows/template-smoke\.yml'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}

  template-smoke:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.hit == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.hit == 'true'
        with:
          package_json_file: internal-apps/package.json
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.hit == 'true'
        with:
          node-version-file: internal-apps/.nvmrc
          cache: pnpm
          cache-dependency-path: internal-apps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.hit == 'true'
        working-directory: internal-apps
      - name: cp → lint/typecheck/test + image build (always cleans up)
        if: needs.changes.outputs.hit == 'true'
        run: bash scripts/ci/template-smoke.sh
        working-directory: internal-apps
      - run: echo "template/platform untouched — gate passes trivially"
        if: needs.changes.outputs.hit != 'true'
