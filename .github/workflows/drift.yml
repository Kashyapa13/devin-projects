name: drift

# The real checks (docs contract §2–§4):
#   drift-schema — migrations ↔ LLD (schema truth = db/migrations)
#   drift-api    — openapi.yaml ↔ routes REGISTRY ↔ LLD registry
#   drift-docs   — behavior-changing PRs update the matching doc same-PR
#   drift-adr    — platform/ diffs carry a new ADR or cite one in the body

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}

defaults:
  run:
    working-directory: internal-apps

jobs:
  drift-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: internal-apps/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: internal-apps/.nvmrc
          cache: pnpm
          cache-dependency-path: internal-apps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/schema-drift.sh

  drift-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: internal-apps/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: internal-apps/.nvmrc
          cache: pnpm
          cache-dependency-path: internal-apps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/api-drift.sh

  drift-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: internal-apps/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: internal-apps/.nvmrc
          cache: pnpm
          cache-dependency-path: internal-apps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/docs-lint.sh

  drift-adr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: internal-apps/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: internal-apps/.nvmrc
          cache: pnpm
          cache-dependency-path: internal-apps/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/adr-check.sh
