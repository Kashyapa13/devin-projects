# Blue/green deploy template — per-app (one pipeline, one rollback each).
# Substitute ${APP}, ${IMAGE}, ${NAMESPACE} at render time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}-green
  namespace: ${NAMESPACE}
  labels: { app: ${APP}, track: green }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ${APP}, track: green }
  template:
    metadata:
      labels: { app: ${APP}, track: green }
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: ${IMAGE}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ secretRef: { name: ${APP}-env } }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 30
---
# Service cutover happens by re-pointing the selector to track: green —
# rollback = point it back to track: blue (see app RUNBOOK.md).
apiVersion: v1
kind: Service
metadata:
  name: ${APP}
  namespace: ${NAMESPACE}
spec:
  selector:
    app: ${APP}
    track: green # flip to blue for instant rollback
  ports:
    - port: 80
      targetPort: 8080
