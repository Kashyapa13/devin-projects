# Migration job template — runs the app's raw-SQL migrations as a
# pre-deploy step (platform/db migrationRunner), same image as the app.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${APP}-migrate-${REVISION}
  namespace: ${NAMESPACE}
  labels: { app: ${APP}, job: migrate }
spec:
  backoffLimit: 0 # migrations never auto-retry — inspect, fix, re-run (runbook)
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: ${IMAGE}
          command: ["node", "apps/${APP}/dist/migrate.js", "up"]
          envFrom: [{ secretRef: { name: ${APP}-env } }]
