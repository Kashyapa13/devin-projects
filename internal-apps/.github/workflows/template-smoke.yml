name: template-smoke

# The fleet gate: `cp -r apps/_template apps/x && pipeline green with no
# edits` — that sentence is the acceptance test. Copies _template →
# apps/_smoke_run, runs lint/typecheck/test + builds the image, always
# deletes _smoke_run after (trap in scripts/ci/template-smoke.sh).

on:
  pull_request:
    paths:
      - "apps/_template/**"
      - "platform/**"
      - "scripts/ci/template-smoke.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - "apps/_template/**"
      - "platform/**"
      - "scripts/ci/template-smoke.sh"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cp → lint/typecheck/test + image build (always cleans up)
        run: bash scripts/ci/template-smoke.sh
