name: template-smoke

# Copies apps/_template, builds it — proves the fleet seed stays green
# with zero edits.
#
# Design annotations:
#   Monorepo = source home only. Deployment units are per-app: one image,
#   one version stream, one pipeline, one rollback per app.
#   Path-filtered pipelines: apps/<app>/** → that app only; platform/** →
#   ALL apps (security-wave: FastLane canary 30–60 min → rest, each gated
#   on its own smoke suite). security.yml never path-filtered.
#   platform/ = build-time workspace packages; never a runtime service.
#   Publishing requires own tests + CHANGELOG + stable-API ADR.
#   Dependency direction one-way: apps → platform; platform → nothing
#   app-specific; apps ↛ apps. import-lint enforces; violations fail CI.
#   Per-app databases, never shared; no cross-app calls without ADR; any
#   app may graduate to its own repo via ADR.
#   DB map: two dev Postgres containers on different ports make cross-app
#   access physically awkward; ETL role separate from app role.
#   Security map: auth/audit/crypto/http live in platform — one review
#   covers all apps; secrets vault-only, .env.example = names; scans on
#   all paths.
#   Publish mechanism: workspace:* internally; changesets → private
#   registry for other repos, gated by ADR.
#   Devin budget: root ≤4 KiB + app ~10 KiB, inside the 16 KiB injection
#   limit.
#   Fleet protocol: the _template is how "app #1 expensive, apps #2+
#   cheap" becomes mechanically true.

on:
  pull_request:
    paths:
      - "apps/_template/**"
      - "platform/**"
  push:
    branches: [main]
    paths:
      - "apps/_template/**"
      - "platform/**"
  schedule:
    - cron: "0 7 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: instantiate template (stub)
        run: |
          cp -r apps/_template /tmp/template-smoke-app
          echo "stub — once _template lands: pnpm install && pnpm build in /tmp/template-smoke-app"
