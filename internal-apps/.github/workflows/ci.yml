name: ci

# Path-filtered stub: apps/<app>/** runs that app only; platform/** runs ALL
# apps. Realized via `turbo --affected` today; split into per-app pipelines
# when the first app lands (AGENTS.md → Repo & deployment law §2).

on:
  pull_request:
    paths:
      - "apps/**"
      - "platform/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "platform/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build test lint --affected
