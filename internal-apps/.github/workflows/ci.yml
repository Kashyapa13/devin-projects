name: ci

# Path-filtered: apps/<app>/** runs that app only; platform/** runs ALL
# apps. Realized via `turbo --affected`; split into per-app pipelines when
# the first app ships. import-lint always runs — dependency law is global.

on:
  pull_request:
    paths:
      - "apps/**"
      - "platform/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "platform/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

jobs:
  import-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm import-lint

  build-test:
    needs: import-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build test lint --affected
