name: drift

# Drift gates — fail-loud stubs (red by design until checkers land).
# schema-drift: migrations ↔ LLD · api-drift: openapi ↔ routes ·
# docs-lint: docs contract · adr-check: ADR required for architectural diffs.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/schema-drift.sh

  api-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/api-drift.sh

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/docs-lint.sh

  adr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/adr-check.sh
