# Cluster-internal service — ingress policy is an app-level decision
# (FastLane/RefundLens are intranet-internal; expose via ingress only when
# the app's RUNBOOK says so). myapp internal-apps 8080
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: internal-apps
  labels:
    app: myapp
spec:
  type: ClusterIP
  selector:
    app: myapp
  ports:
    - name: http
      port: 80
      targetPort: 8080
