# PDB — voluntary disruptions (node drains, upgrades) keep ≥1 replica.
# decision-engine internal-apps
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: decision-engine
  namespace: internal-apps
  labels:
    app: decision-engine
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: decision-engine
