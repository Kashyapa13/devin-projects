# Non-secret env ONLY. Secrets live in decision-engine-env (a Secret managed by
# the vault pipeline — never committed, see app RUNBOOK §secrets).
# decision-engine internal-apps 8083
apiVersion: v1
kind: ConfigMap
metadata:
  name: decision-engine-config
  namespace: internal-apps
  labels:
    app: decision-engine
data:
  NODE_ENV: "production"
  PORT: "8083"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4318"
