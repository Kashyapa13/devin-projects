# Non-secret env ONLY. Secrets live in flags-env (a Secret managed by
# the vault pipeline — never committed, see app RUNBOOK §secrets).
# flags internal-apps 8082
apiVersion: v1
kind: ConfigMap
metadata:
  name: flags-config
  namespace: internal-apps
  labels:
    app: flags
data:
  NODE_ENV: "production"
  PORT: 8082
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
