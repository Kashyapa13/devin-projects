# NetworkPolicy — default-deny posture per app: the pod talks only to
# Postgres, the OTLP collector, DNS, and ingress from the internal CIDR.
# Tighten source ranges per environment (infra/ENVIRONMENTS.md).
# flags internal-apps
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flags
  namespace: internal-apps
  labels:
    app: flags
spec:
  podSelector:
    matchLabels:
      app: flags
  policyTypes: [Ingress, Egress]
  ingress:
    # ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - port: 8082
          protocol: TCP
    # same-app pods only — cross-app calls need an ADR + their own rule
    - from:
        - podSelector:
            matchLabels:
              app: flags
      ports:
        - port: 8082
          protocol: TCP
    # prometheus scrape of /metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 8082
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres (own db — app data law)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8 # render default is broad — set per env (infra/ENVIRONMENTS.md)
      ports: [{ port: 5432, protocol: TCP }]
    # OTLP collector
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports: [{ port: 4318, protocol: TCP }]
