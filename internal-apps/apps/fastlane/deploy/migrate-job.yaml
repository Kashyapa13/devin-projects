# Migration job template — runs the app's raw-SQL migrations as a
# pre-deploy step (platform/db migrationRunner), same image as the app.
apiVersion: batch/v1
kind: Job
metadata:
  name: fastlane-migrate-latest
  namespace: internal-apps
  labels:
    app: fastlane
    job: migrate
spec:
  backoffLimit: 0 # migrations never auto-retry — inspect, fix, re-run (runbook)
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: registry.internal/fastlane:latest
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: fastlane-env
