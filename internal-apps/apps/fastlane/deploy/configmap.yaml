# Non-secret env ONLY. Secrets live in fastlane-env (a Secret managed by
# the vault pipeline — never committed, see app RUNBOOK §secrets).
# fastlane internal-apps 8080
apiVersion: v1
kind: ConfigMap
metadata:
  name: fastlane-config
  namespace: internal-apps
  labels:
    app: fastlane
data:
  NODE_ENV: "production"
  PORT: 8080
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability:4317"
