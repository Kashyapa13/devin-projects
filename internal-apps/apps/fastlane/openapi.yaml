openapi: 3.0.3
info:
  title: fastlane
  version: 0.1.0
  description: KYC review queue — contract derived from api/src/routes.ts
    REGISTRY; LLD section must match (contract test).
paths:
  /healthz:
    get:
      summary: Liveness (platform-http)
      responses:
        "200":
          description: ok
  /readyz:
    get:
      summary: Readiness (platform-http)
      responses:
        "200":
          description: ready
        "503":
          description: not ready
  /api/v1/queue:
    get:
      summary: Queue tabs (mine/team/breaching), cursor paginated
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/cases/:id:
    get:
      summary: One case, C4 masked
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/cases/:id/claim:
    post:
      summary: PENDING→IN_REVIEW claim (supervisor claims ESCALATED)
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/approve:
    post:
      summary: IN_REVIEW→APPROVED, assignee only
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/reject:
    post:
      summary: IN_REVIEW→REJECTED, reason ≥20 chars
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/escalate:
    post:
      summary: IN_REVIEW→ESCALATED
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/note:
    post:
      summary: Append a case note (C3)
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/reveal:
    post:
      summary: Audited unmask of legal_name
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
      x-idempotency-key-required: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
  /api/v1/cases/:id/audit:
    get:
      summary: Audit rows for one case
      x-roles:
        - reviewer
        - supervisor
        - admin
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/audit:
    get:
      summary: Audit export (latest 500)
      x-roles:
        - supervisor
        - admin
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/cases/:id/doc-url:
    get:
      summary: Signed doc URL, 15-min expiry
      x-roles:
        - reviewer
        - supervisor
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/cron/sla-digest:
    post:
      summary: SLA breach digest (service)
      x-roles: []
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /metrics:
    get:
      summary: Prometheus text exposition (ops)
      x-roles: []
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
