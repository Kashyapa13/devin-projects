# HPA — scale on CPU. Custom p95-latency metric (e.g. queue_load_ms) can
# extend this when the metrics adapter lands; the floor is CPU today.
# refundlens internal-apps 2 4
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: refundlens
  namespace: internal-apps
  labels:
    app: refundlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: refundlens
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
