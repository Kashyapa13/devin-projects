# PDB — voluntary disruptions (node drains, upgrades) keep ≥1 replica.
# refundlens internal-apps
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: refundlens
  namespace: internal-apps
  labels:
    app: refundlens
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: refundlens
