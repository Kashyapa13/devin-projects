# Cluster-internal service — ingress policy is an app-level decision
# (FastLane/RefundLens are intranet-internal; expose via ingress only when
# the app's RUNBOOK says so). refundlens internal-apps 8081
apiVersion: v1
kind: Service
metadata:
  name: refundlens
  namespace: internal-apps
  labels:
    app: refundlens
spec:
  type: ClusterIP
  selector:
    app: refundlens
  ports:
    - name: http
      port: 80
      targetPort: 8081
