openapi: 3.0.3
info:
  title: refundlens
  version: 0.1.0
  description: Refunds answer service — contract derived from api/src/routes.ts
    REGISTRY; LLD section must match (contract test).
paths:
  /healthz:
    get:
      summary: Liveness (platform-http)
      responses:
        "200":
          description: ok
  /readyz:
    get:
      summary: Readiness (platform-http)
      responses:
        "200":
          description: ready
        "503":
          description: not ready
  /api/v1/ask:
    post:
      summary: NL question → fenced SQL → {answer, sql, rows, watermark, took_ms}
      x-roles:
        - analyst
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/widgets/:name:
    get:
      summary: Typed params → server-computed series through the same fenced layer
        (WIDGET LAW §4.2)
      x-roles:
        - analyst
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/export.csv:
    get:
      summary: Exact-count CSV export — watermark header, bypasses cache
      x-roles:
        - analyst
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/widgets/:name:
    get:
      summary: Dashboard widget — typed params → server-rendered → fenced exec (WIDGET
        LAW)
      x-roles:
        - analyst
        - ops
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/stream/heartbeat:
    get:
      summary: SSE — heartbeat beats {watermark,last_event_at,beat_at,rows,lag_s}
        (ADR-0016)
      x-roles:
        - analyst
        - ops
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/internal/beat:
    post:
      summary: Heartbeat script posts each beat — records + fans out to SSE (never
        silent)
      x-roles:
        - service
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/monitors:
    get:
      summary: Monitors-as-code definitions + latest state (admin)
      x-roles:
        - admin
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/monitors/:id:
    patch:
      summary: Enable/disable/update a monitor — bumps version
      x-roles:
        - admin
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/health/sync:
    get:
      summary: Watermark + lag + last run status + heartbeat age (F-06)
      x-roles:
        - analyst
        - ops
        - service
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/sync:
    get:
      summary: Sync admin surface — sync_runs history + heartbeat age (F-17)
      x-roles:
        - admin
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /metrics:
    get:
      summary: Prometheus text exposition (ops)
      x-roles: []
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
