openapi: 3.0.3
info:
  title: refundlens
  version: 0.1.0
  description: Refunds answer service — contract derived from api/src/routes.ts
    REGISTRY; LLD section must match (contract test).
paths:
  /healthz:
    get:
      summary: Liveness (platform-http)
      responses:
        "200":
          description: ok
  /readyz:
    get:
      summary: Readiness (platform-http)
      responses:
        "200":
          description: ready
        "503":
          description: not ready
  /api/v1/ask:
    post:
      summary: NL question → fenced SQL → {answer, sql, rows, watermark, took_ms}
      x-roles:
        - analyst
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /api/v1/export.csv:
    get:
      summary: Exact-count CSV export — watermark header, bypasses cache
      x-roles:
        - analyst
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
  /metrics:
    get:
      summary: Prometheus text exposition (ops)
      x-roles: []
      responses:
        "200":
          description: ok
        "400":
          description: envelope error
        "401":
          description: unauthenticated
        "403":
          description: forbidden
