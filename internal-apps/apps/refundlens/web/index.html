<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RefundLens</title>
    <meta name="description" content="Refunds answer console" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
      body { margin: 0 auto; max-width: 56rem; padding: 1rem; }
      .askbar { display: flex; gap: .5rem; margin: 1rem 0; }
      .askbar input { flex: 1; padding: .6rem .8rem; font-size: 1rem; border: 1px solid #9998; border-radius: .4rem; background: Canvas; color: CanvasText; }
      .askbar button { padding: .6rem 1.1rem; font-weight: 600; border-radius: .4rem; border: 1px solid #9998; background: #246; color: #fff; cursor: pointer; }
      .card { border: 1px solid #9996; border-radius: .5rem; padding: 1rem; margin: .8rem 0; }
      .answer { font-size: 1.6rem; font-weight: 700; margin: .2rem 0 .6rem; }
      .meta { display: flex; gap: .8rem; flex-wrap: wrap; font-size: .82em; opacity: .85; }
      .badge { border-radius: 999px; padding: .1rem .55rem; font-size: .78em; font-weight: 600; }
      .badge-cache { background: #2a4; color: #fff; }
      .badge-live { background: #9995; }
      .badge-warn { background: #d80; color: #fff; }
      details.sql { margin: .6rem 0; }
      details.sql summary { cursor: pointer; font-weight: 600; font-size: .9em; }
      details.sql pre { background: #8882; padding: .6rem; border-radius: .4rem; overflow-x: auto; font-size: .82em; }
      table.rows { border-collapse: collapse; width: 100%; margin-top: .5rem; }
      table.rows th, table.rows td { border-bottom: 1px solid #9994; padding: .35rem .55rem; text-align: left; font-size: .88em; }
      .error-card { border-color: #c33; }
      .error-card .code { font-family: ui-monospace, monospace; font-weight: 700; color: #c33; }
      .guidance { margin-top: .4rem; }
      .keys { font-size: .8em; opacity: .7; }
      .examples { font-size: .85em; opacity: .8; margin-top: .2rem; }
      .examples code { background: #8882; padding: .05rem .3rem; border-radius: .3rem; cursor: pointer; }
      /* dashboard (F-09) */
      .dash { max-width: none; }
      body:has(.dash) { max-width: 80rem; }
      .dashbar { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .8rem; }
      .dashbar-row { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
      .dashbar-row.filters { font-size: .85em; }
      .chip { border: 1px solid #9996; border-radius: 999px; padding: .15rem .7rem; font-size: .85em; background: none; color: CanvasText; cursor: pointer; }
      .chip-on { background: #2563eb; border-color: #2563eb; color: #fff; }
      .flabel { opacity: .7; }
      .spacer { flex: 1; }
      .wm-chip { font-size: .82em; border: 1px solid #9995; border-radius: 999px; padding: .2rem .7rem; display: inline-flex; gap: .4rem; align-items: center; }
      .beat-ok { color: #16a34a; font-weight: 700; }
      .beat-degraded { color: #d97706; font-weight: 700; }
      .kpi-wrap { margin: .6rem 0 .9rem; }
      .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: .8rem; }
      .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: .8rem; }
      .card h2 { font-size: .85em; margin: 0 0 .5rem; display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; }
      .empty-hint { font-size: .85em; opacity: .7; font-style: italic; }
      .monitors { list-style: none; margin: 0; padding: 0; font-size: .85em; display: grid; gap: .25rem; }
      .monitors .pill { border-radius: 999px; padding: 0 .5rem; font-size: .8em; background: #9994; }
      .monitors .mon-ok { background: #16a34a; color: #fff; }
      .monitors .mon-firing { background: #dc2626; color: #fff; }
      .monitors .mon-off { background: #9994; }
      .mono { font-family: ui-monospace, monospace; font-size: .85em; opacity: .8; }
      .linkcell { border: none; background: none; padding: 0; color: #2563eb; cursor: pointer; font: inherit; }
      input[type="date"] { font: inherit; padding: .1rem .4rem; border: 1px solid #9996; border-radius: .35rem; background: Canvas; color: CanvasText; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
